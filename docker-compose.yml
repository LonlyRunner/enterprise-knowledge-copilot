services:
  version: "3.9"


  services:


    api:

      build: .

      ports:

        - "8000:8000"


      depends_on:

        - postgres

        - redis



    postgres:

      image:
        postgres:16


      environment:

        POSTGRES_DB:
          ai


        POSTGRES_USER:
          postgres


        POSTGRES_PASSWORD:
          password



    redis:

      image:
        redis:7



    worker:

      build: .


      command:
        celery -A app.tasks worker
